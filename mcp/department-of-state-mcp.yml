why_this_is_a_good_candidate: The read surface is anonymous, stable, and answers questions agents are actually asked
  — what is the current travel advisory for a country, what did the Department say at yesterday's briefing, who
  runs which bureau, what does the latest human rights report say about a country. Today an agent has to scrape
  state.gov to get any of it.
