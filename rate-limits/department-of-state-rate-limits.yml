summary: >-
  The Department of State publishes no rate limits for any of its public API surfaces, and returns no
  rate-limit response headers. An honest zero: there is no number to record, not a number we failed
  to find. The only throttling signal the Department publishes anywhere is a crawl-delay directive in
  robots.txt, which is advisory and applies to crawlers rather than API clients.
  This file replaces a scaffold written by the 2026-05-04 bulk sweep, which invented free /
  professional / enterprise tiers with per-minute and per-month quotas. The Department has no tiers,
  no API keys and no quotas. Those numbers were never published by anyone.
