    note: >-
      An attribution and freshness request rather than a limit. The Office of the Historian states no
      quota and requires no key.
guidance_for_consumers: >-
  Absent a published limit, treat every State host conservatively: honour the robots.txt crawl-delay
  of 5 seconds as a floor, keep concurrency at 1, and use the _fields parameter to avoid pulling
  760KB pages of rendered HTML you do not need. Note that travel.state.gov, step.state.gov and
  cadatacatalog.state.gov sit behind a Cloudflare challenge that refuses non-browser clients outright
  — that is a bot policy, not a rate limit, and retrying will not clear it.
