format: wordpress-rest-error
format_note: >-
  NOT RFC 9457. The Department serves the WordPress REST envelope
  {"code": string, "message": string, "data": {"status": integer}} with content-type
  application/json. There is no `type` URI, no `title`/`detail` split and no
  application/problem+json media type, so an agent cannot dereference an error class — it must match
  on the `code` string.
envelope:
  media_type: application/json
  fields:
    code: Machine-readable error slug, e.g. rest_post_invalid_id. This is the only stable identifier.
    message: Human-readable English sentence. Localised only where the site locale is.
    data.status: HTTP status code, repeated inside the body.
  example:
    code: rest_post_invalid_id
    message: Invalid post ID.
    data:
      status: 404
edge_caveat: >-
  Not every failure returns this envelope. www.state.gov sits behind a WAF that answers some requests
  with an HTML "Technical Difficulties" page and HTTP 403 instead of JSON — observed on
  https://www.state.gov/wp-json/wp/v2/users, where user enumeration is blocked at the edge. An agent
  must check content-type before parsing, and must treat a 403 text/html body as an edge refusal
  rather than an application error.
