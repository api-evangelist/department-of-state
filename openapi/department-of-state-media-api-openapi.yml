openapi: 3.2.0
info:
  title: U.S. Department of State — state.gov Content Media API
  version: wp/v2
  summary: Public, unauthenticated read access to state.gov press releases, briefings, reports, biographies, bureaus, country pages and policy issues.
  description: The Department of State publishes www.state.gov on WordPress and exposes the WordPress REST API at https://www.state.gov/wp-json.
  contact:
    name: U.S. Department of State
    url: https://www.state.gov/
  license:
    name: U.S. Government Work (17 U.S.C. 105) — see the state.gov copyright notice
    url: https://www.state.gov/copyright-information/
servers:
- url: https://www.state.gov/wp-json
  description: Production state.gov WordPress REST API.
security: []
tags:
- name: Media
  description: Media library attachments (images, PDFs, video posters).
paths:
  /wp/v2/media:
    get:
      operationId: listAttachment
      summary: List media
      description: Media library attachments (images, PDFs, video posters). Returns a JSON array; total counts are carried in the X-WP-Total and X-WP-TotalPages response headers.
      tags:
      - Media
      security: []
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      - name: page
        in: query
        description: Current page of the collection.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Maximum number of items to be returned in result set.
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: search
        in: query
        description: Limit results to those matching a string.
        schema:
          type: string
      - name: after
        in: query
        description: Limit response to posts published after a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: modified_after
        in: query
        description: Limit response to posts modified after a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: author
        in: query
        description: Limit result set to posts assigned to specific authors.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: author_exclude
        in: query
        description: Ensure result set excludes posts assigned to specific authors.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: before
        in: query
        description: Limit response to posts published before a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: modified_before
        in: query
        description: Limit response to posts modified before a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: exclude
        in: query
        description: Ensure result set excludes specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: include
        in: query
        description: Limit result set to specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: search_semantics
        in: query
        description: How to interpret the search input.
        schema:
          type: string
          enum:
          - exact
      - name: offset
        in: query
        description: Offset the result set by a specific number of items.
        schema:
          type: integer
      - name: order
        in: query
        description: Order sort attribute ascending or descending.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: orderby
        in: query
        description: Sort collection by post attribute.
        schema:
          type: string
          enum:
          - author
          - date
          - id
          - include
          - modified
          - parent
          - relevance
          - slug
          - include_slugs
          - title
          default: date
      - name: parent
        in: query
        description: Limit result set to items with particular parent IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: parent_exclude
        in: query
        description: Limit result set to all items except those of a particular parent ID.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: search_columns
        in: query
        description: Array of column names to be searched.
        schema:
          type: array
          default: []
          items:
            enum:
            - post_title
            - post_content
            - post_excerpt
            type: string
      - name: slug
        in: query
        description: Limit result set to posts with one or more specific slugs.
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        description: Limit result set to posts assigned one or more statuses.
        schema:
          type: array
          default: inherit
          items:
            enum:
            - inherit
            - private
            - trash
            type: string
      - name: media_type
        in: query
        description: Limit result set to attachments of a particular media type or media types.
        schema:
          type: array
          default: null
          items:
            type: string
            enum:
            - image
            - video
            - text
            - application
            - audio
      - name: mime_type
        in: query
        description: Limit result set to attachments of a particular MIME type or MIME types.
        schema:
          type: array
          default: null
          items:
            type: string
      responses:
        '200':
          description: A collection of media items.
          headers:
            X-WP-Total:
              description: Total number of matching items.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createAttachment
      summary: Create a media item
      description: Create a new media item. Requires an authenticated editorial account; anonymous callers receive 401.
      tags:
      - Media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  description: The date the post was published, in the site's timezone.
                  type:
                  - string
                  - 'null'
                  format: date-time
                date_gmt:
                  description: The date the post was published, as GMT.
                  type:
                  - string
                  - 'null'
                  format: date-time
                slug:
                  description: An alphanumeric identifier for the post unique to its type.
                  type: string
                status:
                  description: A named status for the post.
                  type: string
                  enum:
                  - publish
                  - future
                  - draft
                  - pending
                  - private
                  - acf-disabled
                  - congress
                  - press
                title:
                  description: The title for the post.
                  type: object
                  properties:
                    raw:
                      description: Title for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML title for the post, transformed for display.
                      type: string
                      readOnly: true
                author:
                  description: The ID for the author of the post.
                  type: integer
                featured_media:
                  description: The ID of the featured media for the post.
                  type: integer
                comment_status:
                  description: Whether or not comments are open on the post.
                  type: string
                  enum:
                  - open
                  - closed
                ping_status:
                  description: Whether or not the post can be pinged.
                  type: string
                  enum:
                  - open
                  - closed
                meta:
                  description: Meta fields.
                  type: object
                  properties:
                    _acf_changed:
                      type: boolean
                      title: ''
                      description: ''
                      default: false
                template:
                  description: The theme file to use to display the post.
                  type: string
                acf:
                  description: ACF field data
                  type: object
                alt_text:
                  description: Alternative text to display when attachment is not displayed.
                  type: string
                caption:
                  description: The attachment caption.
                  type: object
                  properties:
                    raw:
                      description: Caption for the attachment, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML caption for the attachment, transformed for display.
                      type: string
                      readOnly: true
                description:
                  description: The attachment description.
                  type: object
                  properties:
                    raw:
                      description: Description for the attachment, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML description for the attachment, transformed for display.
                      type: string
                      readOnly: true
                post:
                  description: The ID for the associated post of the attachment.
                  type: integer
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /wp/v2/media/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier for the media item.
      schema:
        type: integer
    get:
      operationId: getAttachment
      summary: Retrieve a media item
      tags:
      - Media
      security: []
      description: Retrieve a single media item by numeric id.
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      responses:
        '200':
          description: The requested item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAttachment
      summary: Update a media item
      tags:
      - Media
      description: Update an existing media item. Requires an authenticated editorial account. WordPress accepts POST, PUT or PATCH for this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  description: The date the post was published, in the site's timezone.
                  type:
                  - string
                  - 'null'
                  format: date-time
                date_gmt:
                  description: The date the post was published, as GMT.
                  type:
                  - string
                  - 'null'
                  format: date-time
                slug:
                  description: An alphanumeric identifier for the post unique to its type.
                  type: string
                status:
                  description: A named status for the post.
                  type: string
                  enum:
                  - publish
                  - future
                  - draft
                  - pending
                  - private
                  - acf-disabled
                  - congress
                  - press
                title:
                  description: The title for the post.
                  type: object
                  properties:
                    raw:
                      description: Title for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML title for the post, transformed for display.
                      type: string
                      readOnly: true
                author:
                  description: The ID for the author of the post.
                  type: integer
                featured_media:
                  description: The ID of the featured media for the post.
                  type: integer
                comment_status:
                  description: Whether or not comments are open on the post.
                  type: string
                  enum:
                  - open
                  - closed
                ping_status:
                  description: Whether or not the post can be pinged.
                  type: string
                  enum:
                  - open
                  - closed
                meta:
                  description: Meta fields.
                  type: object
                  properties:
                    _acf_changed:
                      type: boolean
                      title: ''
                      description: ''
                      default: false
                template:
                  description: The theme file to use to display the post.
                  type: string
                acf:
                  description: ACF field data
                  type: object
                alt_text:
                  description: Alternative text to display when attachment is not displayed.
                  type: string
                caption:
                  description: The attachment caption.
                  type: object
                  properties:
                    raw:
                      description: Caption for the attachment, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML caption for the attachment, transformed for display.
                      type: string
                      readOnly: true
                description:
                  description: The attachment description.
                  type: object
                  properties:
                    raw:
                      description: Description for the attachment, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML description for the attachment, transformed for display.
                      type: string
                      readOnly: true
                post:
                  description: The ID for the associated post of the attachment.
                  type: integer
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAttachment
      summary: Delete a media item
      tags:
      - Media
      description: Trash or permanently delete a media item. Requires an authenticated editorial account.
      parameters:
      - name: force
        in: query
        description: Whether to bypass Trash and force deletion.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The deleted item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_cannot_create
            message: Sorry, you are not allowed to create posts as this user.
            data:
              status: 403
    BadRequest:
      description: Invalid parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_invalid_param
            message: 'Invalid parameter(s): per_page'
            data:
              status: 400
    NotFound:
      description: No route or resource matched.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_post_invalid_id
            message: Invalid post ID.
            data:
              status: 404
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_forbidden
            message: Sorry, you are not allowed to do that.
            data:
              status: 401
