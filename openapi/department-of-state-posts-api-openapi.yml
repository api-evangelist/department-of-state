openapi: 3.2.0
info:
  title: U.S. Department of State — state.gov Content Posts API
  version: wp/v2
  summary: Public, unauthenticated read access to state.gov press releases, briefings, reports, biographies, bureaus, country pages and policy issues.
  description: The Department of State publishes www.state.gov on WordPress and exposes the WordPress REST API at https://www.state.gov/wp-json.
  contact:
    name: U.S. Department of State
    url: https://www.state.gov/
  license:
    name: U.S. Government Work (17 U.S.C. 105) — see the state.gov copyright notice
    url: https://www.state.gov/copyright-information/
servers:
- url: https://www.state.gov/wp-json
  description: Production state.gov WordPress REST API.
security: []
tags:
- name: Posts
  description: WordPress posts.
paths:
  /wp/v2/posts:
    get:
      operationId: listPost
      summary: List posts
      description: WordPress posts. Returns a JSON array; total counts are carried in the X-WP-Total and X-WP-TotalPages response headers.
      tags:
      - Posts
      security: []
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      - name: page
        in: query
        description: Current page of the collection.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Maximum number of items to be returned in result set.
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: search
        in: query
        description: Limit results to those matching a string.
        schema:
          type: string
      - name: after
        in: query
        description: Limit response to posts published after a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: modified_after
        in: query
        description: Limit response to posts modified after a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: author
        in: query
        description: Limit result set to posts assigned to specific authors.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: author_exclude
        in: query
        description: Ensure result set excludes posts assigned to specific authors.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: before
        in: query
        description: Limit response to posts published before a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: modified_before
        in: query
        description: Limit response to posts modified before a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: exclude
        in: query
        description: Ensure result set excludes specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: include
        in: query
        description: Limit result set to specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: search_semantics
        in: query
        description: How to interpret the search input.
        schema:
          type: string
          enum:
          - exact
      - name: offset
        in: query
        description: Offset the result set by a specific number of items.
        schema:
          type: integer
      - name: order
        in: query
        description: Order sort attribute ascending or descending.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: orderby
        in: query
        description: Sort collection by post attribute.
        schema:
          type: string
          enum:
          - author
          - date
          - id
          - include
          - modified
          - parent
          - relevance
          - slug
          - include_slugs
          - title
          default: date
      - name: search_columns
        in: query
        description: Array of column names to be searched.
        schema:
          type: array
          default: []
          items:
            enum:
            - post_title
            - post_content
            - post_excerpt
            type: string
      - name: slug
        in: query
        description: Limit result set to posts with one or more specific slugs.
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        description: Limit result set to posts assigned one or more statuses.
        schema:
          type: array
          default: publish
          items:
            enum:
            - publish
            - future
            - draft
            - pending
            - private
            - trash
            - auto-draft
            - inherit
            - request-pending
            - request-confirmed
            - request-failed
            - request-completed
            - acf-disabled
            - congress
            - press
            - dp-rewrite-republish
            - any
            type: string
      - name: tax_relation
        in: query
        description: Limit result set based on relationship between multiple taxonomies.
        schema:
          type: string
          enum:
          - AND
          - OR
      - name: categories
        in: query
        description: Limit result set to items with specific terms assigned in the categories taxonomy.
        schema:
          type:
          - object
          - array
      - name: categories_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the categories taxonomy.
        schema:
          type:
          - object
          - array
      - name: tags
        in: query
        description: Limit result set to items with specific terms assigned in the tags taxonomy.
        schema:
          type:
          - object
          - array
      - name: tags_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the tags taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_author_groups
        in: query
        description: Limit result set to items with specific terms assigned in the state_author_groups taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_author_groups_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the state_author_groups taxonomy.
        schema:
          type:
          - object
          - array
      - name: sticky
        in: query
        description: Limit result set to items that are sticky.
        schema:
          type: boolean
      - name: ignore_sticky
        in: query
        description: Whether to ignore sticky posts or not.
        schema:
          type: boolean
          default: true
      - name: format
        in: query
        description: Limit result set to items assigned one or more given formats.
        schema:
          type: array
          items:
            enum:
            - standard
            - aside
            - chat
            - gallery
            - link
            - image
            - quote
            - status
            - video
            - audio
            type: string
          uniqueItems: true
      responses:
        '200':
          description: A collection of posts items.
          headers:
            X-WP-Total:
              description: Total number of matching items.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createPost
      summary: Create a posts item
      description: Create a new posts item. Requires an authenticated editorial account; anonymous callers receive 401.
      tags:
      - Posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  description: The date the post was published, in the site's timezone.
                  type:
                  - string
                  - 'null'
                  format: date-time
                date_gmt:
                  description: The date the post was published, as GMT.
                  type:
                  - string
                  - 'null'
                  format: date-time
                slug:
                  description: An alphanumeric identifier for the post unique to its type.
                  type: string
                status:
                  description: A named status for the post.
                  type: string
                  enum:
                  - publish
                  - future
                  - draft
                  - pending
                  - private
                  - acf-disabled
                  - congress
                  - press
                password:
                  description: A password to protect access to the content and excerpt.
                  type: string
                title:
                  description: The title for the post.
                  type: object
                  properties:
                    raw:
                      description: Title for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML title for the post, transformed for display.
                      type: string
                      readOnly: true
                content:
                  description: The content for the post.
                  type: object
                  properties:
                    raw:
                      description: Content for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML content for the post, transformed for display.
                      type: string
                      readOnly: true
                    block_version:
                      description: Version of the content block format used by the post.
                      type: integer
                      readOnly: true
                    protected:
                      description: Whether the content is protected with a password.
                      type: boolean
                      readOnly: true
                author:
                  description: The ID for the author of the post.
                  type: integer
                excerpt:
                  description: The excerpt for the post.
                  type: object
                  properties:
                    raw:
                      description: Excerpt for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML excerpt for the post, transformed for display.
                      type: string
                      readOnly: true
                    protected:
                      description: Whether the excerpt is protected with a password.
                      type: boolean
                      readOnly: true
                featured_media:
                  description: The ID of the featured media for the post.
                  type: integer
                comment_status:
                  description: Whether or not comments are open on the post.
                  type: string
                  enum:
                  - open
                  - closed
                ping_status:
                  description: Whether or not the post can be pinged.
                  type: string
                  enum:
                  - open
                  - closed
                format:
                  description: The format for the post.
                  type: string
                  enum:
                  - standard
                  - aside
                  - chat
                  - gallery
                  - link
                  - image
                  - quote
                  - status
                  - video
                  - audio
                meta:
                  description: Meta fields.
                  type: object
                  properties:
                    _acf_changed:
                      type: boolean
                      title: ''
                      description: ''
                      default: false
                    _yoast_wpseo_focuskw:
                      type: string
                      title: ''
                      description: ''
                      default: ''
                    _yoast_wpseo_title:
                      type: string
                      title: ''
                      description: ''
                      default: ''
                    _yoast_wpseo_metadesc:
                      type: string
                      title: ''
                      description: ''
                      default: ''
                    footnotes:
                      type: string
                      title: ''
                      description: ''
                      default: ''
                sticky:
                  description: Whether or not the post should be treated as sticky.
                  type: boolean
                template:
                  description: The theme file to use to display the post.
                  type: string
                categories:
                  description: The terms assigned to the post in the category taxonomy.
                  type: array
                  items:
                    type: integer
                tags:
                  description: The terms assigned to the post in the post_tag taxonomy.
                  type: array
                  items:
                    type: integer
                state_author_groups:
                  description: The terms assigned to the post in the state_author_groups taxonomy.
                  type: array
                  items:
                    type: integer
                acf:
                  description: ACF field data
                  type: object
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /wp/v2/posts/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier for the posts item.
      schema:
        type: integer
    get:
      operationId: getPost
      summary: Retrieve a posts item
      tags:
      - Posts
      security: []
      description: Retrieve a single posts item by numeric id.
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      - name: excerpt_length
        in: query
        description: Override the default excerpt length.
        schema:
          type: integer
      - name: password
        in: query
        description: The password for the post if it is password protected.
        schema:
          type: string
      responses:
        '200':
          description: The requested item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updatePost
      summary: Update a posts item
      tags:
      - Posts
      description: Update an existing posts item. Requires an authenticated editorial account. WordPress accepts POST, PUT or PATCH for this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  description: The date the post was published, in the site's timezone.
                  type:
                  - string
                  - 'null'
                  format: date-time
                date_gmt:
                  description: The date the post was published, as GMT.
                  type:
                  - string
                  - 'null'
                  format: date-time
                slug:
                  description: An alphanumeric identifier for the post unique to its type.
                  type: string
                status:
                  description: A named status for the post.
                  type: string
                  enum:
                  - publish
                  - future
                  - draft
                  - pending
                  - private
                  - acf-disabled
                  - congress
                  - press
                password:
                  description: A password to protect access to the content and excerpt.
                  type: string
                title:
                  description: The title for the post.
                  type: object
                  properties:
                    raw:
                      description: Title for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML title for the post, transformed for display.
                      type: string
                      readOnly: true
                content:
                  description: The content for the post.
                  type: object
                  properties:
                    raw:
                      description: Content for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML content for the post, transformed for display.
                      type: string
                      readOnly: true
                    block_version:
                      description: Version of the content block format used by the post.
                      type: integer
                      readOnly: true
                    protected:
                      description: Whether the content is protected with a password.
                      type: boolean
                      readOnly: true
                author:
                  description: The ID for the author of the post.
                  type: integer
                excerpt:
                  description: The excerpt for the post.
                  type: object
                  properties:
                    raw:
                      description: Excerpt for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML excerpt for the post, transformed for display.
                      type: string
                      readOnly: true
                    protected:
                      description: Whether the excerpt is protected with a password.
                      type: boolean
                      readOnly: true
                featured_media:
                  description: The ID of the featured media for the post.
                  type: integer
                comment_status:
                  description: Whether or not comments are open on the post.
                  type: string
                  enum:
                  - open
                  - closed
                ping_status:
                  description: Whether or not the post can be pinged.
                  type: string
                  enum:
                  - open
                  - closed
                format:
                  description: The format for the post.
                  type: string
                  enum:
                  - standard
                  - aside
                  - chat
                  - gallery
                  - link
                  - image
                  - quote
                  - status
                  - video
                  - audio
                meta:
                  description: Meta fields.
                  type: object
                  properties:
                    _acf_changed:
                      type: boolean
                      title: ''
                      description: ''
                      default: false
                    _yoast_wpseo_focuskw:
                      type: string
                      title: ''
                      description: ''
                      default: ''
                    _yoast_wpseo_title:
                      type: string
                      title: ''
                      description: ''
                      default: ''
                    _yoast_wpseo_metadesc:
                      type: string
                      title: ''
                      description: ''
                      default: ''
                    footnotes:
                      type: string
                      title: ''
                      description: ''
                      default: ''
                sticky:
                  description: Whether or not the post should be treated as sticky.
                  type: boolean
                template:
                  description: The theme file to use to display the post.
                  type: string
                categories:
                  description: The terms assigned to the post in the category taxonomy.
                  type: array
                  items:
                    type: integer
                tags:
                  description: The terms assigned to the post in the post_tag taxonomy.
                  type: array
                  items:
                    type: integer
                state_author_groups:
                  description: The terms assigned to the post in the state_author_groups taxonomy.
                  type: array
                  items:
                    type: integer
                acf:
                  description: ACF field data
                  type: object
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deletePost
      summary: Delete a posts item
      tags:
      - Posts
      description: Trash or permanently delete a posts item. Requires an authenticated editorial account.
      parameters:
      - name: force
        in: query
        description: Whether to bypass Trash and force deletion.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The deleted item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_cannot_create
            message: Sorry, you are not allowed to create posts as this user.
            data:
              status: 403
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_forbidden
            message: Sorry, you are not allowed to do that.
            data:
              status: 401
    BadRequest:
      description: Invalid parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_invalid_param
            message: 'Invalid parameter(s): per_page'
            data:
              status: 400
    NotFound:
      description: No route or resource matched.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_post_invalid_id
            message: Invalid post ID.
            data:
              status: 404
  schemas:
    RestError:
      type: object
      description: WordPress REST API error envelope.
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. rest_post_invalid_id.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code.
      required:
      - code
      - message
    Post:
      $schema: http://json-schema.org/draft-04/schema#
      title: post
      type: object
      properties:
        date:
          description: The date the post was published, in the site's timezone.
          type:
          - string
          - 'null'
          format: date-time
        date_gmt:
          description: The date the post was published, as GMT.
          type:
          - string
          - 'null'
          format: date-time
        guid:
          description: The globally unique identifier for the post.
          type: object
          readOnly: true
          properties:
            raw:
              description: GUID for the post, as it exists in the database.
              type: string
              readOnly: true
            rendered:
              description: GUID for the post, transformed for display.
              type: string
              readOnly: true
        id:
          description: Unique identifier for the post.
          type: integer
          readOnly: true
        link:
          description: URL to the post.
          type: string
          format: uri
          readOnly: true
        modified:
          description: The date the post was last modified, in the site's timezone.
          type: string
          format: date-time
          readOnly: true
        modified_gmt:
          description: The date the post was last modified, as GMT.
          type: string
          format: date-time
          readOnly: true
        slug:
          description: An alphanumeric identifier for the post unique to its type.
          type: string
        status:
          description: A named status for the post.
          type: string
          enum:
          - publish
          - future
          - draft
          - pending
          - private
          - acf-disabled
          - congress
          - press
        type:
          description: Type of post.
          type: string
          readOnly: true
        password:
          description: A password to protect access to the content and excerpt.
          type: string
        permalink_template:
          description: Permalink template for the post.
          type: string
          readOnly: true
        generated_slug:
          description: Slug automatically generated from the post title.
          type: string
          readOnly: true
        class_list:
          description: An array of the class names for the post container element.
          type: array
          readOnly: true
          items:
            type: string
        title:
          description: The title for the post.
          type: object
          properties:
            raw:
              description: Title for the post, as it exists in the database.
              type: string
            rendered:
              description: HTML title for the post, transformed for display.
              type: string
              readOnly: true
        content:
          description: The content for the post.
          type: object
          properties:
            raw:
              description: Content for the post, as it exists in the database.
              type: string
            rendered:
              description: HTML content for the post, transformed for display.
              type: string
              readOnly: true
            block_version:
              description: Version of the content block format used by the post.
              type: integer
              readOnly: true
            protected:
              description: Whether the content is protected with a password.
              type: boolean
              readOnly: true
        author:
          description: The ID for the author of the post.
          type: integer
        excerpt:
          description: The excerpt for the post.
          type: object
          properties:
            raw:
              description: Excerpt for the post, as it exists in the database.
              type: string
            rendered:
              description: HTML excerpt for the post, transformed for display.
              type: string
              readOnly: true
            protected:
              description: Whether the excerpt is protected with a password.
              type: boolean
              readOnly: true
        featured_media:
          description: The ID of the featured media for the post.
          type: integer
        comment_status:
          description: Whether or not comments are open on the post.
          type: string
          enum:
          - open
          - closed
        ping_status:
          description: Whether or not the post can be pinged.
          type: string
          enum:
          - open
          - closed
        format:
          description: The format for the post.
          type: string
          enum:
          - standard
          - aside
          - chat
          - gallery
          - link
          - image
          - quote
          - status
          - video
          - audio
        meta:
          description: Meta fields.
          type: object
          properties:
            _acf_changed:
              type: boolean
              title: ''
              description: ''
              default: false
            _yoast_wpseo_focuskw:
              type: string
              title: ''
              description: ''
              default: ''
            _yoast_wpseo_title:
              type: string
              title: ''
              description: ''
              default: ''
            _yoast_wpseo_metadesc:
              type: string
              title: ''
              description: ''
              default: ''
            footnotes:
              type: string
              title: ''
              description: ''
              default: ''
        sticky:
          description: Whether or not the post should be treated as sticky.
          type: boolean
        template:
          description: The theme file to use to display the post.
          type: string
        categories:
          description: The terms assigned to the post in the category taxonomy.
          type: array
          items:
            type: integer
        tags:
          description: The terms assigned to the post in the post_tag taxonomy.
          type: array
          items:
            type: integer
        state_author_groups:
          description: The terms assigned to the post in the state_author_groups taxonomy.
          type: array
          items:
            type: integer
        acf:
          description: Expose advanced custom fields.
          type: object
      links:
      - rel: https://api.w.org/action-publish
        title: The current user can publish this post.
        href: https://www.state.gov/wp-json/wp/v2/posts/{id}
        targetSchema:
          type: object
          properties:
            status:
              type: string
              enum:
              - publish
              - future
      - rel: https://api.w.org/action-unfiltered-html
        title: The current user can post unfiltered HTML markup and JavaScript.
        href: https://www.state.gov/wp-json/wp/v2/posts/{id}
        targetSchema:
          type: object
          properties:
            content:
              raw:
                type: string
      - rel: https://api.w.org/action-sticky
        title: The current user can sticky this post.
        href: https://www.state.gov/wp-json/wp/v2/posts/{id}
        targetSchema:
          type: object
          properties:
