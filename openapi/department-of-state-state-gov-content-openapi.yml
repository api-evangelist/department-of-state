components:
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress Application Passwords. Advertised by the Department at https://www.state.gov/wp-json/ under authentication.application-passwords,
        authorization endpoint https://www.state.gov/wp-admin/authorize-application.php. Editorial use only — the public read
        surface requires no credentials.
  schemas:
    Category:
      $schema: http://json-schema.org/draft-04/schema#
      title: category
      type: object
      properties:
        id:
          description: Unique identifier for the term.
          type: integer
          readOnly: true
        count:
          description: Number of published posts for the term.
          type: integer
          readOnly: true
        description:
          description: HTML description of the term.
          type: string
        link:
          description: URL of the term.
          type: string
          format: uri
          readOnly: true
        name:
          description: HTML title for the term.
          type: string
          required: true
        slug:
          description: An alphanumeric identifier for the term unique to its type.
          type: string
        taxonomy:
          description: Type attribution for the term.
          type: string
          enum:
          - category
          readOnly: true
        parent:
          description: The parent term ID.
          type: integer
        meta:
          description: Meta fields.
          type: object
        acf:
          description: Expose advanced custom fields.
          type: object
