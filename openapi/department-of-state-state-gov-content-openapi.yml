  /wp/v2/search:
    get:
      operationId: listSearchResult
      summary: List search
      description: Cross-content search across state.gov content types. Returns a JSON array; total counts are carried in
        the X-WP-Total and X-WP-TotalPages response headers.
      tags:
      - search
      security: []
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          default: view
      - name: page
        in: query
        description: Current page of the collection.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Maximum number of items to be returned in result set.
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: search
        in: query
        description: Limit results to those matching a string.
        schema:
          type: string
      - name: type
        in: query
        description: Limit results to items of an object type.
        schema:
          type: string
          enum:
          - post
          - term
          - post-format
          default: post
      - name: subtype
        in: query
        description: Limit results to items of one or more object subtypes.
        schema:
          type: array
          default: any
          items:
            enum:
            - post
            - page
            - state_biography
            - state_people
            - state_press_release
            - state_briefing
            - state_bureau
            - state_country
            - state_policy_issue
            - state_term_coll
            - state_standard_land
            - state_report
            - state_trip_travel
            - state_ext_content
            - state_state
            - category
            - post_tag
            - state_author_groups
            - state_briefing_type
            - state_countries_and_areas
            - state_document_type
            - state_policy_issues
            - state_report_types
            - state_states
            - state_subjects
            - state_years
            - state_biography_types
            - any
            type: string
      - name: exclude
        in: query
        description: Ensure result set excludes specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: include
        in: query
        description: Limit result set to specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      responses:
        '200':
          description: A collection of search items.
          headers:
            X-WP-Total:
              description: Total number of matching items.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
