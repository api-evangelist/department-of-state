openapi: 3.1.0
info:
  title: U.S. Department of State — state.gov Content API
  version: wp/v2
  summary: Public, unauthenticated read access to state.gov press releases, briefings, reports, biographies, bureaus, country
    pages and policy issues.
  description: 'The Department of State publishes www.state.gov on WordPress and exposes the WordPress REST API at https://www.state.gov/wp-json.
    Alongside the core WordPress resources the Department registers its own content types and taxonomies (state_press_release,
    state_briefing, state_report, state_biography, state_bureau, state_country, state_policy_issue, state_trip_travel and
    others), all readable anonymously over HTTPS with no API key. Write operations exist but require an authenticated editorial
    account (WordPress Application Passwords) and are not available to the public.


    This description was derived mechanically from the Department''s own live discovery documents: the route index at https://www.state.gov/wp-json/
    and an HTTP OPTIONS request against each collection and item route, which returns the provider-authored JSON Schema and
    argument list for that resource. No paths, parameters or schemas were invented. The verbatim source documents are kept
    in openapi/_original/.'
  contact:
    name: U.S. Department of State
    url: https://www.state.gov/
  license:
    name: U.S. Government Work (17 U.S.C. 105) — see the state.gov copyright notice
    url: https://www.state.gov/copyright-information/
servers:
- url: https://www.state.gov/wp-json
  description: Production state.gov WordPress REST API.
externalDocs:
  description: WordPress REST API handbook — the upstream specification this surface implements
  url: https://developer.wordpress.org/rest-api/
tags:
- name: categories
  description: WordPress category taxonomy.
- name: media
  description: Media library attachments (images, PDFs, video posters).
- name: pages
  description: state.gov pages.
- name: posts
  description: WordPress posts.
- name: search
  description: Cross-content search across state.gov content types.
- name: state_archive_tags
  description: Archive tag taxonomy.
- name: state_author_groups
  description: Author group taxonomy.
- name: state_biography
  description: Biographies of Department principals and officials.
- name: state_biography_types
  description: Biography type taxonomy.
- name: state_briefing
  description: Press briefings, remarks and transcripts.
- name: state_briefing_type
  description: Briefing type taxonomy.
- name: state_bureau
  description: Bureaus and offices of the Department of State.
- name: state_countries_and_areas
  description: Countries and areas taxonomy.
- name: state_country
  description: Country and area landing content.
- name: state_document_type
  description: Document type taxonomy.
- name: state_ext_content
  description: Externally sourced content syndicated onto state.gov.
- name: state_live_draft_tags
  description: Live draft tag taxonomy.
- name: state_people
  description: People records used across state.gov.
- name: state_policy_issue
  description: Policy issue landing content.
- name: state_policy_issues
  description: Policy issues taxonomy.
- name: state_press_release
  description: Press releases issued by the Office of the Spokesperson and Department bureaus.
- name: state_report
  description: Department reports (human rights, religious freedom, trafficking in persons, and others).
- name: state_report_types
  description: Report type taxonomy.
- name: state_rss_feeds
  description: Configured RSS feed definitions.
- name: state_standard_land
  description: Standard landing pages.
- name: state_state
  description: State (U.S. state) content type.
- name: state_states
  description: U.S. states taxonomy.
- name: state_subjects
  description: Subject taxonomy.
- name: state_term_coll
  description: Term collection content.
- name: state_trip_travel
  description: Official travel by the Secretary and other principals.
- name: state_years
  description: Year taxonomy.
- name: tags
  description: WordPress post tag taxonomy.
- name: taxonomies
  description: Registered taxonomies and their REST bases.
- name: types
  description: Registered content types and their REST bases.
security: []
paths:
  /wp/v2/categories:
    get:
      operationId: listCategory
      summary: List categories
      description: WordPress category taxonomy. Returns a JSON array; total counts are carried in the X-WP-Total and X-WP-TotalPages
        response headers.
      tags:
      - categories
      security: []
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      - name: page
        in: query
        description: Current page of the collection.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Maximum number of items to be returned in result set.
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: search
        in: query
        description: Limit results to those matching a string.
        schema:
          type: string
      - name: exclude
        in: query
        description: Ensure result set excludes specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: include
        in: query
        description: Limit result set to specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: order
        in: query
        description: Order sort attribute ascending or descending.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: orderby
        in: query
        description: Sort collection by term attribute.
        schema:
          type: string
          enum:
          - id
          - include
          - name
          - slug
          - include_slugs
          - term_group
          - description
          - count
          default: name
      - name: hide_empty
        in: query
        description: Whether to hide terms not assigned to any posts.
        schema:
          type: boolean
          default: false
      - name: parent
        in: query
        description: Limit result set to terms assigned to a specific parent.
        schema:
          type: integer
      - name: post
        in: query
        description: Limit result set to terms assigned to a specific post.
        schema:
          type: integer
          default: null
      - name: slug
        in: query
        description: Limit result set to terms with one or more specific slugs.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: A collection of categories items.
          headers:
            X-WP-Total:
              description: Total number of matching items.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createCategory
      summary: Create a categories item
      description: Create a new categories item. Requires an authenticated editorial account; anonymous callers receive 401.
      tags:
      - categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  description: HTML description of the term.
                  type: string
                name:
                  description: HTML title for the term.
                  type: string
                slug:
                  description: An alphanumeric identifier for the term unique to its type.
                  type: string
                parent:
                  description: The parent term ID.
                  type: integer
                meta:
                  description: Meta fields.
                  type: object
                acf:
                  description: ACF field data
                  type: object
              required:
              - name
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /wp/v2/categories/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier for the categories item.
      schema:
        type: integer
    get:
      operationId: getCategory
      summary: Retrieve a categories item
      tags:
      - categories
      security: []
      description: Retrieve a single categories item by numeric id.
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      responses:
        '200':
          description: The requested item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCategory
      summary: Update a categories item
      tags:
      - categories
      description: Update an existing categories item. Requires an authenticated editorial account. WordPress accepts POST,
        PUT or PATCH for this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  description: HTML description of the term.
                  type: string
                name:
                  description: HTML title for the term.
                  type: string
                slug:
                  description: An alphanumeric identifier for the term unique to its type.
                  type: string
                parent:
                  description: The parent term ID.
                  type: integer
                meta:
                  description: Meta fields.
                  type: object
                acf:
                  description: ACF field data
                  type: object
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCategory
      summary: Delete a categories item
      tags:
      - categories
      description: Trash or permanently delete a categories item. Requires an authenticated editorial account.
      parameters:
      - name: force
        in: query
        description: Required to be true, as terms do not support trashing.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The deleted item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
