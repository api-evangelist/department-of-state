openapi: 3.2.0
info:
  title: U.S.
  version: wp/v2
  summary: Public, unauthenticated read access to state.gov press releases, briefings, reports, biographies, bureaus, country pages and policy issues.
  description: The Department of State publishes www.state.gov on WordPress and exposes the WordPress REST API at https://www.state.gov/wp-json.
  contact:
    name: U.S. Department of State
    url: https://www.state.gov/
  license:
    name: U.S. Government Work (17 U.S.C. 105) — see the state.gov copyright notice
    url: https://www.state.gov/copyright-information/
servers:
- url: https://www.state.gov/wp-json
  description: Production state.gov WordPress REST API.
security: []
tags:
- name: state_term_coll
  description: Term collection content.
paths:
  /wp/v2/state_term_coll:
    get:
      operationId: listStateTermColl
      summary: List state_term_coll
      description: Term collection content. Returns a JSON array; total counts are carried in the X-WP-Total and X-WP-TotalPages response headers.
      tags:
      - state_term_coll
      security: []
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      - name: page
        in: query
        description: Current page of the collection.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Maximum number of items to be returned in result set.
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: search
        in: query
        description: Limit results to those matching a string.
        schema:
          type: string
      - name: after
        in: query
        description: Limit response to posts published after a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: modified_after
        in: query
        description: Limit response to posts modified after a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: author
        in: query
        description: Limit result set to posts assigned to specific authors.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: author_exclude
        in: query
        description: Ensure result set excludes posts assigned to specific authors.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: before
        in: query
        description: Limit response to posts published before a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: modified_before
        in: query
        description: Limit response to posts modified before a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: exclude
        in: query
        description: Ensure result set excludes specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: include
        in: query
        description: Limit result set to specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: search_semantics
        in: query
        description: How to interpret the search input.
        schema:
          type: string
          enum:
          - exact
      - name: offset
        in: query
        description: Offset the result set by a specific number of items.
        schema:
          type: integer
      - name: order
        in: query
        description: Order sort attribute ascending or descending.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: orderby
        in: query
        description: Sort collection by post attribute.
        schema:
          type: string
          enum:
          - author
          - date
          - id
          - include
          - modified
          - parent
          - relevance
          - slug
          - include_slugs
          - title
          default: date
      - name: parent
        in: query
        description: Limit result set to items with particular parent IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: parent_exclude
        in: query
        description: Limit result set to all items except those of a particular parent ID.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: search_columns
        in: query
        description: Array of column names to be searched.
        schema:
          type: array
          default: []
          items:
            enum:
            - post_title
            - post_content
            - post_excerpt
            type: string
      - name: slug
        in: query
        description: Limit result set to posts with one or more specific slugs.
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        description: Limit result set to posts assigned one or more statuses.
        schema:
          type: array
          default: publish
          items:
            enum:
            - publish
            - future
            - draft
            - pending
            - private
            - trash
            - auto-draft
            - inherit
            - request-pending
            - request-confirmed
            - request-failed
            - request-completed
            - acf-disabled
            - congress
            - press
            - dp-rewrite-republish
            - any
            type: string
      - name: tax_relation
        in: query
        description: Limit result set based on relationship between multiple taxonomies.
        schema:
          type: string
          enum:
          - AND
          - OR
      - name: state_author_groups
        in: query
        description: Limit result set to items with specific terms assigned in the state_author_groups taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_author_groups_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the state_author_groups taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_countries_and_areas
        in: query
        description: Limit result set to items with specific terms assigned in the state_countries_and_areas taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_countries_and_areas_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the state_countries_and_areas taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_document_type
        in: query
        description: Limit result set to items with specific terms assigned in the state_document_type taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_document_type_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the state_document_type taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_policy_issues
        in: query
        description: Limit result set to items with specific terms assigned in the state_policy_issues taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_policy_issues_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the state_policy_issues taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_states
        in: query
        description: Limit result set to items with specific terms assigned in the state_states taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_states_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the state_states taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_subjects
        in: query
        description: Limit result set to items with specific terms assigned in the state_subjects taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_subjects_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the state_subjects taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_archive_tags
        in: query
        description: Limit result set to items with specific terms assigned in the state_archive_tags taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_archive_tags_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the state_archive_tags taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_live_draft_tags
        in: query
        description: Limit result set to items with specific terms assigned in the state_live_draft_tags taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_live_draft_tags_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the state_live_draft_tags taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_rss_feeds
        in: query
        description: Limit result set to items with specific terms assigned in the state_rss_feeds taxonomy.
        schema:
          type:
          - object
          - array
      - name: state_rss_feeds_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the state_rss_feeds taxonomy.
        schema:
          type:
          - object
          - array
      responses:
        '200':
          description: A collection of state_term_coll items.
          headers:
            X-WP-Total:
              description: Total number of matching items.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateTermColl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createStateTermColl
      summary: Create a state_term_coll item
      description: Create a new state_term_coll item. Requires an authenticated editorial account; anonymous callers receive 401.
      tags:
      - state_term_coll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  description: The date the post was published, in the site's timezone.
                  type:
                  - string
                  - 'null'
                  format: date-time
                date_gmt:
                  description: The date the post was published, as GMT.
                  type:
                  - string
                  - 'null'
                  format: date-time
                slug:
                  description: An alphanumeric identifier for the post unique to its type.
                  type: string
                status:
                  description: A named status for the post.
                  type: string
                  enum:
                  - publish
                  - future
                  - draft
                  - pending
                  - private
                  - acf-disabled
                  - congress
                  - press
                password:
                  description: A password to protect access to the content and excerpt.
                  type: string
                parent:
                  description: The ID for the parent of the post.
                  type: integer
                title:
                  description: The title for the post.
                  type: object
                  properties:
                    raw:
                      description: Title for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML title for the post, transformed for display.
                      type: string
                      readOnly: true
                content:
                  description: The content for the post.
                  type: object
                  properties:
                    raw:
                      description: Content for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML content for the post, transformed for display.
                      type: string
                      readOnly: true
                    block_version:
                      description: Version of the content block format used by the post.
                      type: integer
                      readOnly: true
                    protected:
                      description: Whether the content is protected with a password.
                      type: boolean
                      readOnly: true
                author:
                  description: The ID for the author of the post.
                  type: integer
                excerpt:
                  description: The excerpt for the post.
                  type: object
                  properties:
                    raw:
                      description: Excerpt for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML excerpt for the post, transformed for display.
                      type: string
                      readOnly: true
                    protected:
                      description: Whether the excerpt is protected with a password.
                      type: boolean
                      readOnly: true
                featured_media:
                  description: The ID of the featured media for the post.
                  type: integer
                template:
                  description: The theme file to use to display the post.
                  type: string
                state_author_groups:
                  description: The terms assigned to the post in the state_author_groups taxonomy.
                  type: array
                  items:
                    type: integer
                state_countries_and_areas:
                  description: The terms assigned to the post in the state_countries_and_areas taxonomy.
                  type: array
                  items:
                    type: integer
                state_document_type:
                  description: The terms assigned to the post in the state_document_type taxonomy.
                  type: array
                  items:
                    type: integer
                state_policy_issues:
                  description: The terms assigned to the post in the state_policy_issues taxonomy.
                  type: array
                  items:
                    type: integer
                state_states:
                  description: The terms assigned to the post in the state_states taxonomy.
                  type: array
                  items:
                    type: integer
                state_subjects:
                  description: The terms assigned to the post in the state_subjects taxonomy.
                  type: array
                  items:
                    type: integer
                state_archive_tags:
                  description: The terms assigned to the post in the state_archive_tags taxonomy.
                  type: array
                  items:
                    type: integer
                state_live_draft_tags:
                  description: The terms assigned to the post in the state_live_draft_tags taxonomy.
                  type: array
                  items:
                    type: integer
                state_rss_feeds:
                  description: The terms assigned to the post in the state_rss_feeds taxonomy.
                  type: array
                  items:
                    type: integer
                acf:
                  description: ACF field data
                  type: object
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateTermColl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /wp/v2/state_term_coll/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier for the state_term_coll item.
      schema:
        type: integer
    get:
      operationId: getStateTermColl
      summary: Retrieve a state_term_coll item
      tags:
      - state_term_coll
      security: []
      description: Retrieve a single state_term_coll item by numeric id.
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      - name: excerpt_length
        in: query
        description: Override the default excerpt length.
        schema:
          type: integer
      - name: password
        in: query
        description: The password for the post if it is password protected.
        schema:
          type: string
      responses:
        '200':
          description: The requested item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateTermColl'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateStateTermColl
      summary: Update a state_term_coll item
      tags:
      - state_term_coll
      description: Update an existing state_term_coll item. Requires an authenticated editorial account. WordPress accepts POST, PUT or PATCH for this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  description: The date the post was published, in the site's timezone.
                  type:
                  - string
                  - 'null'
                  format: date-time
                date_gmt:
                  description: The date the post was published, as GMT.
                  type:
                  - string
                  - 'null'
                  format: date-time
                slug:
                  description: An alphanumeric identifier for the post unique to its type.
                  type: string
                status:
                  description: A named status for the post.
                  type: string
                  enum:
                  - publish
                  - future
                  - draft
                  - pending
                  - private
                  - acf-disabled
                  - congress
                  - press
                password:
                  description: A password to protect access to the content and excerpt.
                  type: string
                parent:
                  description: The ID for the parent of the post.
                  type: integer
                title:
                  description: The title for the post.
                  type: object
                  properties:
                    raw:
                      description: Title for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML title for the post, transformed for display.
                      type: string
                      readOnly: true
                content:
                  description: The content for the post.
                  type: object
                  properties:
                    raw:
                      description: Content for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML content for the post, transformed for display.
                      type: string
                      readOnly: true
                    block_version:
                      description: Version of the content block format used by the post.
                      type: integer
                      readOnly: true
                    protected:
                      description: Whether the content is protected with a password.
                      type: boolean
                      readOnly: true
                author:
                  description: The ID for the author of the post.
                  type: integer
                excerpt:
                  description: The excerpt for the post.
                  type: object
                  properties:
                    raw:
                      description: Excerpt for the post, as it exists in the database.
                      type: string
                    rendered:
                      description: HTML excerpt for the post, transformed for display.
                      type: string
                      readOnly: true
                    protected:
                      description: Whether the excerpt is protected with a password.
                      type: boolean
                      readOnly: true
                featured_media:
                  description: The ID of the featured media for the post.
                  type: integer
                template:
                  description: The theme file to use to display the post.
                  type: string
                state_author_groups:
                  description: The terms assigned to the post in the state_author_groups taxonomy.
                  type: array
                  items:
                    type: integer
                state_countries_and_areas:
                  description: The terms assigned to the post in the state_countries_and_areas taxonomy.
                  type: array
                  items:
                    type: integer
                state_document_type:
                  description: The terms assigned to the post in the state_document_type taxonomy.
                  type: array
                  items:
                    type: integer
                state_policy_issues:
                  description: The terms assigned to the post in the state_policy_issues taxonomy.
                  type: array
                  items:
                    type: integer
                state_states:
                  description: The terms assigned to the post in the state_states taxonomy.
                  type: array
                  items:
                    type: integer
                state_subjects:
                  description: The terms assigned to the post in the state_subjects taxonomy.
                  type: array
                  items:
                    type: integer
                state_archive_tags:
                  description: The terms assigned to the post in the state_archive_tags taxonomy.
                  type: array
                  items:
                    type: integer
                state_live_draft_tags:
                  description: The terms assigned to the post in the state_live_draft_tags taxonomy.
                  type: array
                  items:
                    type: integer
                state_rss_feeds:
                  description: The terms assigned to the post in the state_rss_feeds taxonomy.
                  type: array
                  items:
                    type: integer
                acf:
                  description: ACF field data
                  type: object
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateTermColl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteStateTermColl
      summary: Delete a state_term_coll item
      tags:
      - state_term_coll
      description: Trash or permanently delete a state_term_coll item. Requires an authenticated editorial account.
      parameters:
      - name: force
        in: query
        description: Whether to bypass Trash and force deletion.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The deleted item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateTermColl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_cannot_create
            message: Sorry, you are not allowed to create posts as this user.
            data:
              status: 403
    BadRequest:
      description: Invalid parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_invalid_param
            message: 'Invalid parameter(s): per_page'
            data:
              status: 400
    NotFound:
      description: No route or resource matched.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_post_invalid_id
            message: Invalid post ID.
            data:
              status: 404
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
          example:
            code: rest_forbidden
            message: Sorry, you are not allowed to do that.
            data:
              status: 401
  schemas:
    RestError:
      type: object
      description: WordPress REST API error envelope.
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. rest_post_invalid_id.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code.
      required:
      - code
      - message
    StateTermColl:
      $schema: http://json-schema.org/draft-04/schema#
      title: state_term_coll
      type: object
      properties:
        date:
          description: The date the post was published, in the site's timezone.
          type:
          - string
          - 'null'
          format: date-time
        date_gmt:
          description: The date the post was published, as GMT.
          type:
          - string
          - 'null'
          format: date-time
        guid:
          description: The globally unique identifier for the post.
          type: object
          readOnly: true
          properties:
            raw:
              description: GUID for the post, as it exists in the database.
              type: string
              readOnly: true
            rendered:
              description: GUID for the post, transformed for display.
              type: string
              readOnly: true
        id:
          description: Unique identifier for the post.
          type: integer
          readOnly: true
        link:
          description: URL to the post.
          type: string
          format: uri
          readOnly: true
        modified:
          description: The date the post was last modified, in the site's timezone.
          type: string
          format: date-time
          readOnly: true
        modified_gmt:
          description: The date the post was last modified, as GMT.
          type: string
          format: date-time
          readOnly: true
        slug:
          description: An alphanumeric identifier for the post unique to its type.
          type: string
        status:
          description: A named status for the post.
          type: string
          enum:
          - publish
          - future
          - draft
          - pending
          - private
          - acf-disabled
          - congress
          - press
        type:
          description: Type of post.
          type: string
          readOnly: true
        password:
          description: A password to protect access to the content and excerpt.
          type: string
        permalink_template:
          description: Permalink template for the post.
          type: string
          readOnly: true
        generated_slug:
          description: Slug automatically generated from the post title.
          type: string
          readOnly: true
        class_list:
          description: An array of the class names for the post container element.
          type: array
          readOnly: true
          items:
            type: string
        parent:
          description: The ID for the parent of the post.
          type: integer
        title:
          description: The title for the post.
          type: object
          properties:
            raw:
              description: Title for the post, as it exists in the database.
              type: string
            rendered:
              description: HTML title for the post, transformed for display.
              type: string
              readOnly: true
        content:
          description: The content for the post.
          type: object
          properties:
            raw:
              description: Content for the post, as it exists in the database.
              type: string
            rendered:
              description: HTML content for the post, transformed for display.
              type: string
              readOnly: true
            block_version:
              description: Version of the content block format used by the post.
              type: integer
              readOnly: true
            protected:
              description: Whether the content is protected with a password.
              type: boolean
              readOnly: true
        author:
          description: The ID for the author of the post.
          type: integer
        excerpt:
          description: The excerpt for the post.
          type: object
          properties:
            raw:
              description: Excerpt for the post, as it exists in the database.
              type: string
            rendered:
              description: HTML excerpt for the post, transformed for display.
              type: string
              readOnly: true
            protected:
              description: Whether the excerpt is protected with a password.
              type: boolean
              readOnly: true
        featured_media:
          description: The ID of the featured media for the post.
          type: integer
        template:
          description: The theme file to use to display the post.
          type: string
        state_author_groups:
          description: The terms assigned to the post in the state_author_groups taxonomy.
          type: array
          items:
            type: integer
        state_countries_and_areas:
          description: The terms assigned to the post in the state_countries_and_areas taxonomy.
          type: array
          items:
