summary: >-
  There are no plans and no pricing. The Department of State is a U.S. federal agency; every public
  API surface found in this repo — the state.gov Content API at https://www.state.gov/wp-json, the
  Office of the Historian Ebook Catalog API at https://history.state.gov/api/v1/catalog, the Travel
  Advisories RSS feed and the DCAT-US open data catalog at https://www.state.gov/data.json — is
  served anonymously, free of charge, with no registration, no API key, no quota and no commercial
  tier. There is no pricing page to point at because there is nothing to buy.
  This file replaces a scaffold written by the 2026-05-04 bulk sweep, which invented Free /
  Professional / Enterprise tiers with request quotas, overage pricing, SLA targets and a dedicated
  account manager. None of that exists.
access:
