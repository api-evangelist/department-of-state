apis:
  - aid: department-of-state:state-gov-content-api
    name: state.gov Content API
    description: >-
      The Department of State runs www.state.gov on WordPress and exposes the WordPress REST API
      anonymously at https://www.state.gov/wp-json. Alongside the core WordPress resources the
      Department registers its own content types and taxonomies — state_press_release,
      state_briefing, state_report, state_biography, state_bureau, state_country,
      state_policy_issue, state_trip_travel and sixteen more — giving structured JSON access to
      press releases, press briefings, the flagship annual reports, principal biographies, bureau
      pages and country and policy landing content. 473 routes are advertised in the index; 65 read
      operations are public with no key, no registration and no quota. Write operations exist but
      require a Department editorial account. The Department publishes no OpenAPI; the description
      in this repo was derived mechanically from its own route index and OPTIONS schemas.
    humanURL: https://www.state.gov/
    baseURL: https://www.state.gov/wp-json
    tags:
      - Content
      - Press Releases
      - Reports
      - Foreign Affairs
      - WordPress
    properties:
      - type: OpenAPI
        url: openapi/department-of-state-state-gov-content-openapi.yml
      - type: APIReference
        url: https://www.state.gov/wp-json/
      - type: Authentication
        url: authentication/department-of-state-authentication.yml
      - type: Conventions
        url: conventions/department-of-state-conventions.yml
      - type: ErrorCatalog
        url: errors/department-of-state-problem-types.yml
      - type: DataModel
        url: data-model/department-of-state-data-model.yml
      - type: JSONSchema
        url: json-schema/_index.yml
      - type: Overlay
        url: overlays/department-of-state-state-gov-content-overlay.yaml
      - type: AgentSkill
        url: skills/_index.yml
      - type: Documentation
        url: https://developer.wordpress.org/rest-api/
  - aid: department-of-state:historian-ebook-catalog-api
    name: Office of the Historian Ebook Catalog API
    description: >-
      A RESTful, OPDS Catalog 1.1 feed of the Foreign Relations of the United States series — the
      official documentary record of major U.S. foreign policy decisions — published by the Office
      of the Historian. Four documented operations (catalog root, all volumes in series order, ten
      most recent, subject browse, and Lucene free-text search) return Atom XML carrying acquisition
      links to EPUB, MOBI and PDF editions plus cover images. No registration, no API key, no
      authentication. This is the only surface the Department documents on a developer page of its
      own, and the source data behind it is open on GitHub as TEI XML.
    humanURL: https://history.state.gov/developer/catalog
    baseURL: https://history.state.gov/api/v1
    tags:
      - History
      - Publications
      - OPDS
      - Open Data
      - Foreign Affairs
    properties:
      - type: Documentation
        url: https://history.state.gov/developer/catalog
      - type: DeveloperPortal
        url: https://history.state.gov/developer
      - type: GitHubOrganization
        url: https://github.com/HistoryAtState
      - type: Support
        url: https://github.com/HistoryAtState/Feedback
      - type: SourceCode
        url: https://github.com/HistoryAtState/hsg-shell
      - type: AgentSkill
        url: skills/department-of-state-frus-ebook-catalog.md
  - aid: department-of-state:open-data-catalog
    name: Department of State Open Data Catalog
    description: >-
      The Department's Project Open Data catalog, served as a single machine-readable DCAT-US 3.0
      document at https://www.state.gov/data.json. 397 dataset entries covering Foreign Relations
      metadata, Humanitarian Information Unit cartography, passport and visa statistics, and
      international law digests, each with distribution URLs. It is the Department's own index of
      what it publishes, and it is the document that points at the Bureau of Consular Affairs data
      catalog at cadatacatalog.state.gov.
    humanURL: https://catalog.data.gov/dataset?organization=state-gov
    baseURL: https://www.state.gov/data.json
    tags:
      - Open Data
      - DCAT
      - Catalog
    properties:
