aid: department-of-state
name: Department of State
description: 'The U.S. Department of State leads U.S. foreign policy, conducts diplomacy with foreign
  governments, issues U.S. passports and visas, supports U.S. citizens abroad, and publishes country-specific
  information and travel advisories. It operates no unified developer portal and issues no API keys, but
  it does serve several real, anonymous, machine-readable surfaces: the state.gov Content API at https://www.state.gov/wp-json,
  where 473 WordPress REST routes expose press releases, briefings, reports, biographies, bureaus and
  country and policy content as structured JSON with no credential; the Office of the Historian Ebook
  Catalog API, an OPDS Catalog 1.1 feed of the Foreign Relations of the United States series and the only
  surface the Department documents on a developer page of its own; a DCAT-US 3.0 open data catalog of
  397 datasets at https://www.state.gov/data.json; and the Travel Advisories RSS feed. Discovery is the
  weak point rather than supply — none of the nine State hosts probed serves any /.well-known/ document,
  three of the four State APIs listed in the federal inventory have been retired without notice, and travel.state.gov
  and the Bureau of Consular Affairs data catalog refuse non-browser clients outright.'
