apis:
- aid: department-of-state:historian-ebook-catalog-api
  name: Office of the Historian Ebook Catalog API
  description: A RESTful, OPDS Catalog 1.1 feed of the Foreign Relations of the United States series —
    the official documentary record of major U.S. foreign policy decisions — published by the Office of
    the Historian. Four documented operations (catalog root, all volumes in series order, ten most recent,
    subject browse, and Lucene free-text search) return Atom XML carrying acquisition links to EPUB, MOBI
    and PDF editions plus cover images. No registration, no API key, no authentication. This is the only
    surface the Department documents on a developer page of its own, and the source data behind it is
    open on GitHub as TEI XML.
  humanURL: https://history.state.gov/developer/catalog
  baseURL: https://history.state.gov/api/v1
  tags:
  - History
  - Publications
  - OPDS
  - Open Data
  - Foreign Affairs
  properties:
  - type: Documentation
    url: https://history.state.gov/developer/catalog
  - type: DeveloperPortal
    url: https://history.state.gov/developer
  - type: GitHubOrganization
    url: https://github.com/HistoryAtState
  - type: Support
    url: https://github.com/HistoryAtState/Feedback
  - type: SourceCode
    url: https://github.com/HistoryAtState/hsg-shell
  - type: AgentSkill
    url: skills/department-of-state-frus-ebook-catalog.md
- aid: department-of-state:open-data-catalog
  name: Department of State Open Data Catalog
  description: The Department's Project Open Data catalog, served as a single machine-readable DCAT-US
    3.0 document at https://www.state.gov/data.json. 397 dataset entries covering Foreign Relations metadata,
    Humanitarian Information Unit cartography, passport and visa statistics, and international law digests,
    each with distribution URLs. It is the Department's own index of what it publishes, and it is the
    document that points at the Bureau of Consular Affairs data catalog at cadatacatalog.state.gov.
  humanURL: https://catalog.data.gov/dataset?organization=state-gov
  baseURL: https://www.state.gov/data.json
  tags:
  - Open Data
  - DCAT
  - Catalog
  properties:
  - type: OpenData
    url: https://www.state.gov/data.json
  - type: Documentation
    url: https://catalog.data.gov/dataset?organization=state-gov
