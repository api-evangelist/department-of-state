traversal_notes:
- Term ids in a taxonomy array (state_countries_and_areas, state_policy_issues, state_bureau, state_years, state_subjects)
  resolve against that taxonomy collection, not against a content collection.
- Use _embed on a retrieve operation to inline author, featured media and terms in one round trip instead of walking
  the ids.
- 'The author id cannot be dereferenced anonymously: https://www.state.gov/wp-json/wp/v2/users returns HTTP 403
  from the edge WAF.'
- content.rendered and excerpt.rendered are HTML strings, not structured data. Titles carry HTML entities on the
  wire.
